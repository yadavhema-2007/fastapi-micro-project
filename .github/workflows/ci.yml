name: FastAPI Automated Testing CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Project 1 Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project1_basic/requirements.txt

      - name: Run Project 1 Tests
        run: |
          pytest project1_basic -v

      - name: Install Project 2 Dependencies
        run: |
          pip install -r project2_crud/requirements.txt

      - name: Run Project 2 Tests
        run: |
          pytest project2_crud -v
